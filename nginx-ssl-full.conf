# Nginx configuration with Cloudflare Origin Certificate
# Supports both HTTP (redirect to HTTPS) and HTTPS

# HTTP server - redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name clingai.live www.clingai.live 173.255.193.131;

    # Redirect all HTTP requests to HTTPS
    return 301 https://$host$request_uri;
}

# HTTPS server with Cloudflare Origin Certificate
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name clingai.live www.clingai.live 173.255.193.131;

    # SSL Certificate (Cloudflare Origin Certificate)
    ssl_certificate /etc/nginx/ssl/clingai.live.crt;
    ssl_certificate_key /etc/nginx/ssl/clingai.live.key;

    # SSL Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Frontend
    location / {
        root /var/www/honeyai;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Admin Panel
    location = /admin {
        return 301 /admin/;
    }
    location /admin/ {
        alias /var/www/honeyai-admin/;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }

    # Backend API
    location /api {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header CF-Ray $http_cf_ray;
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 50M;
    }

    # Static files caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /var/www/honeyai;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}

