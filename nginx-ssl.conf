# Nginx configuration with SSL support for Cloudflare
# This configuration supports both HTTP and HTTPS

# HTTP server - redirect to HTTPS (if SSL is configured)
server {
    listen 80;
    listen [::]:80;
    server_name clingai.live www.clingai.live 173.255.193.131;

    # Allow Cloudflare to connect via HTTP (Flexible SSL mode)
    # Or redirect to HTTPS if using Full SSL mode
    
    # For Cloudflare Flexible SSL mode (recommended for now):
    # Just serve content normally
    
    # Frontend
    location / {
        root /var/www/honeyai;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Admin Panel
    location = /admin {
        return 301 /admin/;
    }
    location /admin/ {
        alias /var/www/honeyai-admin/;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }

    # Backend API
    location /api {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 50M;
    }

    # Static files caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /var/www/honeyai;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}

